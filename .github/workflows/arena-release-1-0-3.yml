name: Publish Babol Toyor 1.0.3 assets
on:
  push:
    branches: [arena/3662fe5b-baboltoyoor]
    paths: [.github/workflows/arena-release-1-0-3.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 47b0111564705a2a9f6aa31646e2743d45e01700
      - name: Verify source and create versioned bundles
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c SHA256SUMS.txt
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED, ZipInfo
          import hashlib, shutil
          root = Path.cwd()
          version = (root / 'RELEASE_VERSION.txt').read_text().strip()
          assert version == '1.0.3'
          out = Path('/tmp/bt-v1-release')
          out.mkdir(exist_ok=True)
          def add_bytes(z, name, data):
              info = ZipInfo(name, (2026, 1, 1, 0, 0, 0))
              info.compress_type = ZIP_DEFLATED
              info.external_attr = 0o100644 << 16
              z.writestr(info, data, compress_type=ZIP_DEFLATED, compresslevel=9)
          app = out / f'BabolToyor-App-{version}.zip'
          with ZipFile(app, 'w') as z:
              for p in sorted(root.rglob('*')):
                  if not p.is_file() or p.is_symlink(): continue
                  rel = p.relative_to(root)
                  if any(x in ('.git', 'node_modules', 'data', 'data-preview', 'build', 'dist') for x in rel.parts): continue
                  if rel.name == '.env' or rel.name.endswith(('.db', '.db-wal', '.db-shm', '.log')): continue
                  add_bytes(z, rel.as_posix(), p.read_bytes())
          setup = out / f'BabolToyor-Windows-Setup-{version}.zip'
          with ZipFile(setup, 'w') as z:
              add_bytes(z, 'app.zip', app.read_bytes())
              add_bytes(z, 'BabolToyor-Setup.cmd', (root/'windows-installer/BabolToyor-Setup.cmd').read_bytes())
              add_bytes(z, 'REPORTS-BACKUP-UPDATE-fa.md', (root/'docs/reports-backup-update-fa.md').read_bytes())
              add_bytes(z, 'RELEASE-1.0.3-fa.md', (root/'RELEASE-1.0.3-fa.md').read_bytes())
          shutil.copyfile(root/'windows-installer/BabolToyor-Setup.cmd', out/f'BabolToyor-Setup-{version}.cmd')
          shutil.copyfile(root/'docs/reports-backup-update-fa.md', out/'reports-backup-update-fa.md')
          with ZipFile(app) as z:
              assert z.testzip() is None
              assert all(n in z.namelist() for n in ['RELEASE_VERSION.txt','lib/routes/backups.js','lib/routes/resources.js','server.js'])
          with ZipFile(setup) as z: assert z.testzip() is None
          names = [setup.name, app.name, f'BabolToyor-Setup-{version}.cmd']
          (out/'SHA256SUMS-1.0.3.txt').write_text(''.join(hashlib.sha256((out/n).read_bytes()).hexdigest()+'  '+n+'\n' for n in names))
          print((out/'SHA256SUMS-1.0.3.txt').read_text())
          PY
      - name: Upload assets to version 1.0.3 draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v1.0.3 /tmp/bt-v1-release/BabolToyor-Windows-Setup-1.0.3.zip /tmp/bt-v1-release/BabolToyor-App-1.0.3.zip /tmp/bt-v1-release/BabolToyor-Setup-1.0.3.cmd /tmp/bt-v1-release/SHA256SUMS-1.0.3.txt /tmp/bt-v1-release/reports-backup-update-fa.md
