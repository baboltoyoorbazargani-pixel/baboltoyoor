name: Temporary browser checks
on: [push, workflow_dispatch]
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright-core
      - name: Run browser tests
        env:
          BT_CHROMIUM_PATH: /usr/bin/google-chrome
        run: node --test tests/sales-layout-daily-browser.test.js tests/sales-live-session-browser.test.js tests/gate-search-onsite-layout-browser.test.js tests/order-unified-layout-browser.test.js tests/sales-products-browser.test.js
