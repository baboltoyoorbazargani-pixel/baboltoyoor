name: Refresh installer assets (step-by-step guide)
run-name: Refresh Windows installer assets (install guide build)
on:
  push:
    branches:
      - arena/ccf1f396-baboltoyoor
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (merged install guide)
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify manifest and full test suite
        run: |
          sha256sum -c SHA256SUMS.txt
          npm test
      - name: Build offline Windows package (deterministic)
        run: |
          echo '' | base64 -d > "$RUNNER_TEMP/build-package.py"
          BT_ROOT="$GITHUB_WORKSPACE" BT_OUT="$RUNNER_TEMP" BT_FINAL="$GITHUB_WORKSPACE/BabolToyor-Windows-Setup.zip" python3 "$RUNNER_TEMP/build-package.py"
          unzip -t "$GITHUB_WORKSPACE/BabolToyor-Windows-Setup.zip" | tail -1
      - name: Upload assets to release v37.43.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v37.43.0 \
            BabolToyor-Windows-Setup.zip \
            windows-installer/BabolToyor-Setup.cmd \
            --clobber
