name: Refresh Windows installer assets (SQLite build)

# Temporary publishing helper: this sandbox cannot reach uploads.github.com,
# so the release assets are rebuilt from main and attached by a runner.
on:
  push:
    branches: [arena/301036b9-baboltoyoor]
    paths: [.github/workflows/refresh-installer-assets.yml]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Use Node.js 22 (node:sqlite)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Full test suite on Node 22
        run: npm test

      - name: Build the offline Windows setup package
        run: |
          set -euo pipefail
          mkdir -p dist/BabolToyor-Windows-Setup
          cp windows-installer/BabolToyor-Setup.cmd dist/BabolToyor-Windows-Setup/
          cp windows-installer/README-fa.md dist/BabolToyor-Windows-Setup/README-INSTALL-fa.md
          cp docs/sqlite-database-fa.md dist/BabolToyor-Windows-Setup/README-SQL-fa.md
          git ls-files | tr '\n' '\0' | xargs -0 zip -q dist/BabolToyor-Windows-Setup/app.zip
          (cd dist && zip -qr BabolToyor-Windows-Setup.zip BabolToyor-Windows-Setup)
          ls -lh dist/BabolToyor-Windows-Setup dist/BabolToyor-Windows-Setup.zip
          sha256sum dist/BabolToyor-Windows-Setup.zip

      - name: Verify app.zip manifest and reproducible single-file installer
        run: |
          set -euo pipefail
          mkdir -p /tmp/btcheck && cd /tmp/btcheck
          unzip -q "$GITHUB_WORKSPACE/dist/BabolToyor-Windows-Setup/app.zip" -d app
          cd app
          sha256sum -c SHA256SUMS.txt > /dev/null
          echo "app.zip: $(find . -type f | wc -l) files, manifest verified"
          cd "$GITHUB_WORKSPACE"
          node windows-installer/build-single-file.js
          git diff --exit-code -- windows-installer/BabolToyor-Setup.cmd
          echo "single-file installer is reproducible"

      - name: Smoke test the SQLite store on Node 22
        run: |
          set -euo pipefail
          DATA_DIR="$(mktemp -d)" ADMIN_INITIAL_PASSWORD='Ci!Smoke12345' node --disable-warning=ExperimentalWarning -e "
          const s=require('./lib/store'); s.init();
          const q=s.sql.query('SELECT COUNT(*) AS n FROM products');
          console.log('SQL products:', q[0].n);
          if(q[0].n!==63) process.exit(1);
          "

      - name: Upload refreshed assets to release v37.43.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload v37.43.0 \
            dist/BabolToyor-Windows-Setup.zip \
            windows-installer/BabolToyor-Setup.cmd \
            --clobber --repo "$GITHUB_REPOSITORY"
          gh release view v37.43.0 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'
