name: Publish Babol Toyor 1.0.42 assets
on:
  push:
    branches: [arena/642a57ce-baboltoyoor]
    paths: [.github/workflows/arena-release-1-0-42.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ca0e8b3494796eb4c2cba57a531441dbe580eb38
      - name: Verify source and create versioned bundles
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = ca0e8b3494796eb4c2cba57a531441dbe580eb38
          sha256sum -c SHA256SUMS.txt
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED, ZipInfo
          import hashlib, shutil, subprocess
          root = Path.cwd()
          version = (root / 'RELEASE_VERSION.txt').read_text().strip()
          assert version == '1.0.42'
          out = Path('/tmp/bt-1-0-42-release')
          out.mkdir(exist_ok=True)
          def add_bytes(z, name, data):
              info = ZipInfo(name, (2026, 1, 1, 0, 0, 0))
              info.compress_type = ZIP_DEFLATED
              info.external_attr = 0o100644 << 16
              z.writestr(info, data, compress_type=ZIP_DEFLATED, compresslevel=9)
          tracked = subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          app = out / f'BabolToyor-App-{version}.zip'
          with ZipFile(app, 'w') as z:
              for name in sorted(filter(None, tracked)):
                  p = root / name
                  if not p.is_file() or p.is_symlink(): continue
                  parts = p.relative_to(root).parts
                  if any(x in ('.git','node_modules','data','data-preview','build','dist') for x in parts): continue
                  if p.name == '.env' or (p.name.startswith('.env.') and p.name != '.env.example') or p.name.endswith(('.db','.db-wal','.db-shm','.db-journal','.log')): continue
                  add_bytes(z, name, p.read_bytes())
          setup = out / f'BabolToyor-Windows-Setup-{version}.zip'
          with ZipFile(setup, 'w') as z:
              add_bytes(z, 'app.zip', app.read_bytes())
              add_bytes(z, 'BabolToyor-Setup.cmd', (root/'windows-installer/BabolToyor-Setup.cmd').read_bytes())
              add_bytes(z, 'DOMAIN-HTTPS-fa.md', (root/'docs/domain-https-fa.md').read_bytes())
              add_bytes(z, 'REPORTS-BACKUP-UPDATE-fa.md', (root/'docs/reports-backup-update-fa.md').read_bytes())
              add_bytes(z, f'RELEASE-{version}-fa.md', (root/f'RELEASE-{version}-fa.md').read_bytes())
          shutil.copyfile(root/'windows-installer/BabolToyor-Setup.cmd', out/f'BabolToyor-Setup-{version}.cmd')
          shutil.copyfile(root/'docs/domain-https-fa.md', out/'domain-https-fa.md')
          shutil.copyfile(root/'docs/reports-backup-update-fa.md', out/'reports-backup-update-fa.md')
          with ZipFile(app) as z:
              assert z.testzip() is None
              assert all(n in z.namelist() for n in ['RELEASE_VERSION.txt','SHA256SUMS.txt','lib/routes/backups.js','lib/transport-sales-views.js','server.js'])
              verify = out/'verify-app'
              z.extractall(verify)
          subprocess.run(['sha256sum','-c','SHA256SUMS.txt'], cwd=verify, check=True, stdout=subprocess.DEVNULL)
          with ZipFile(setup) as z:
              assert z.testzip() is None
              assert z.read('app.zip') == app.read_bytes()
              assert z.read('BabolToyor-Setup.cmd') == (root/'windows-installer/BabolToyor-Setup.cmd').read_bytes()
          names = [setup.name, app.name, f'BabolToyor-Setup-{version}.cmd', 'domain-https-fa.md', 'reports-backup-update-fa.md']
          (out/f'SHA256SUMS-{version}.txt').write_text(''.join(hashlib.sha256((out/n).read_bytes()).hexdigest()+'  '+n+'\n' for n in names))
          print((out/f'SHA256SUMS-{version}.txt').read_text())
          PY
      - name: Upload verified assets to draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v1.0.42 /tmp/bt-1-0-42-release/BabolToyor-Windows-Setup-1.0.42.zip /tmp/bt-1-0-42-release/BabolToyor-App-1.0.42.zip /tmp/bt-1-0-42-release/BabolToyor-Setup-1.0.42.cmd /tmp/bt-1-0-42-release/SHA256SUMS-1.0.42.txt /tmp/bt-1-0-42-release/reports-backup-update-fa.md /tmp/bt-1-0-42-release/domain-https-fa.md
