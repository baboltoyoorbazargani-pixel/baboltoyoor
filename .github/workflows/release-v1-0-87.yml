name: Package and upload v1.0.87 release

on:
  push:
    branches:
      - arena/9f07d2ba-baboltoyoor
    paths:
      - .github/workflows/release-v1-0-87.yml
      - scripts/arena-release-build.py

permissions:
  contents: write

jobs:
  package-and-upload:
    if: github.ref == 'refs/heads/arena/9f07d2ba-baboltoyoor' && contains(github.event.head_commit.message, '[publish-v1.0.87-assets]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the release tooling
        uses: actions/checkout@v4
        with:
          path: tooling

      - name: Check out the exact release source
        uses: actions/checkout@v4
        with:
          ref: 0a4a8744df688b244b6a1db1ece08f45af033a3f
          path: source

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify pinned source and release metadata
        working-directory: source
        run: |
          test "$(git rev-parse HEAD)" = "0a4a8744df688b244b6a1db1ece08f45af033a3f"
          test "$(tr -d '\r\n' < RELEASE_VERSION.txt)" = "1.0.87"
          test "$(tr -d '\r\n' < VERSION.txt)" = "37.6.0"
          node -e "if (require('./package.json').version !== '37.6.0') process.exit(1)"
          sha256sum --check --strict SHA256SUMS.txt
          node --test tests/release-version.test.js tests/windows-installer.test.js

      - name: Build independent release assets
        run: python3 tooling/scripts/arena-release-build.py "$RUNNER_TEMP/assets" source --expected-version 1.0.87

      - name: Verify versioned asset checksums
        working-directory: ${{ runner.temp }}/assets
        run: sha256sum --check --strict SHA256SUMS-1.0.87.txt

      - name: Upload assets to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v1.0.87 "$RUNNER_TEMP"/assets/* --repo "$GITHUB_REPOSITORY" --clobber
