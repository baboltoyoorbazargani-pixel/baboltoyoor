name: Form and transport layout browser check
on:
  push:
    branches: [arena/b9133712-baboltoyoor]
    paths: [.github/workflows/arena-form-layout-browser.yml]
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts playwright-core@1.50.1
      - name: Chromium layouts
        shell: bash
        run: |
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          test -x "$CHROME"
          failed=0
          for file in tests/transport-desk-browser.test.js tests/form-browser.test.js tests/long-text-browser.test.js tests/ui-alignment-browser.test.js tests/desktop-responsive-browser.test.js tests/sales-delivery-tabs-browser.test.js; do
            if BT_CHROMIUM_PATH="$CHROME" node --test "$file" > /tmp/test-output.log 2>&1; then echo "$file passed"; else failed=1; encoded=$(tail -90 /tmp/test-output.log | base64 -w0); echo "::error title=$file::$encoded"; fi
          done
          exit "$failed"
