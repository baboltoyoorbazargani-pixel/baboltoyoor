name: Temporary release upload
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a455109c5d6835c317996d09e3f9f2d1e0015909
      - name: Build and upload pinned release files
        env:
          GH_TOKEN: ${{ github.token }}
          BT_OUT: /tmp/bt156-assets
        run: |
          echo "" | base64 -d > /tmp/bt156-build.py
          python3 /tmp/bt156-build.py
          gh release upload v1.0.56 /tmp/bt156-assets/* --clobber
