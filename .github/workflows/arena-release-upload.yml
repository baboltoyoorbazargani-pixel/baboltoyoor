name: Temporary release upload
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b663ba58a86f8bd47c3fc7d3d1f13e2730949db8
      - name: Build and upload pinned release files
        env:
          GH_TOKEN: ${{ github.token }}
          BT_OUT: /tmp/bt157-assets
        run: |
          echo "" | base64 -d > /tmp/bt157-build.py
          python3 /tmp/bt157-build.py
          gh release upload v1.0.57 /tmp/bt157-assets/* --clobber
