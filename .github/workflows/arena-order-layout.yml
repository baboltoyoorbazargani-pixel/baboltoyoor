name: Arena order layout checks
on: [push]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright-core
      - name: Chromium scenarios
        env:
          BT_CHROMIUM_PATH: /usr/bin/google-chrome
        run: |
          set -o pipefail
          node --test tests/order-unified-layout-browser.test.js tests/transport-financial-layout-browser.test.js tests/store-display-layout-browser.test.js tests/transport-desk-browser.test.js tests/notification-roles-compact-browser.test.js 2>&1 | tee browser.log
      - name: Publish diagnostic annotation
        if: failure()
        run: echo "::error::$(tail -100 browser.log | base64 -w0)"
