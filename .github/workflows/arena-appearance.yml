name: Temporary appearance browser verification
on: [push, workflow_dispatch]
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright-core
      - name: Browser checks
        run: |
          export BT_CHROMIUM_PATH=$(which google-chrome || which chromium || which chromium-browser)
          node --test tests/appearance-editor-browser.test.js tests/transport-desk-browser.test.js tests/warehouse-document-layout.test.js
