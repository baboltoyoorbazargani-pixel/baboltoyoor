name: Temporary appearance and print browser checks
on: [push, workflow_dispatch]
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright-core
      - name: Test in Chromium
        run: |
          export BT_CHROMIUM_PATH=$(which google-chrome || which chromium || which chromium-browser)
          set +e
          node --test tests/appearance-editor-browser.test.js tests/print-no-popup-browser.test.js tests/warehouse-document-layout.test.js tests/warehouse-store-document-browser.test.js tests/transport-desk-browser.test.js > /tmp/results.txt 2>&1
          result=$?
          cat /tmp/results.txt
          if [ "$result" -ne 0 ]; then echo "::error title=BrowserTestLog::$(base64 -w0 /tmp/results.txt)"; fi
          exit "$result"
      - name: Check baseline native print lifecycle
        if: always()
        run: |
          export BT_CHROMIUM_PATH=$(which google-chrome || which chromium || which chromium-browser)
          mkdir /tmp/baseline-app
          git archive c63d8966c63b25dd89c07ee5c8eb95acdfec43bd | tar -x -C /tmp/baseline-app
          ln -s "$PWD/node_modules" /tmp/baseline-app/node_modules
          cd /tmp/baseline-app
          set +e
          node --test tests/print-no-popup-browser.test.js > /tmp/baseline.txt 2>&1
          result=$?
          cat /tmp/baseline.txt
          if [ "$result" -ne 0 ]; then echo "::error title=BaselinePrintLog::$(base64 -w0 /tmp/baseline.txt)"; fi
          exit "$result"
