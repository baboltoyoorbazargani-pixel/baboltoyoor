name: Temporary release assets 1.0.53
on:
  push:
    branches: [arena/a5290389-baboltoyoor]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fc27844577b31c7aff99b5af0b10ebb1adbd87db
      - name: Build release assets from exact source commit
        shell: bash
        run: |
          cat > /tmp/bt153-build.py <<'PYCODE'
          import pathlib,subprocess,zipfile,hashlib,shutil
          root=pathlib.Path('.'); out=pathlib.Path('/tmp/bt153-assets');out.mkdir(exist_ok=True)
          files=[s for s in subprocess.check_output(['git','ls-files','-z']).decode().split('\0') if s and not s.startswith('.github/')]
          def add(z,name,data):
           i=zipfile.ZipInfo(name,(2020,1,1,0,0,0));i.compress_type=zipfile.ZIP_DEFLATED;i.external_attr=(0o100644<<16);i.create_system=3;z.writestr(i,data,compresslevel=9)
          app=out/'BabolToyor-App-1.0.53.zip'
          with zipfile.ZipFile(app,'w') as z:
           for f in sorted(files):add(z,f,(root/f).read_bytes())
          cmd=(root/'windows-installer/BabolToyor-Setup.cmd').read_bytes();(out/'BabolToyor-Setup-1.0.53.cmd').write_bytes(cmd)
          with zipfile.ZipFile(out/'BabolToyor-Windows-Setup-1.0.53.zip','w') as z:
           add(z,'app.zip',app.read_bytes());add(z,'BabolToyor-Setup.cmd',cmd)
           for name in ['INSTALL-STEPS-fa.html','INSTALL-STEPS-fa.md','README-fa.md']:add(z,name,(root/'windows-installer'/name).read_bytes())
          for f in ['domain-https-fa.md','reports-backup-update-fa.md']:shutil.copyfile(root/'docs'/f,out/f)
          for p in out.glob('*.zip'):
           with zipfile.ZipFile(p) as z:assert z.testzip() is None
          assets=sorted(p for p in out.iterdir() if p.name!='SHA256SUMS-1.0.53.txt')
          (out/'SHA256SUMS-1.0.53.txt').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in assets))
          print('\n'.join(f'{p.name} {p.stat().st_size} {hashlib.sha256(p.read_bytes()).hexdigest()}' for p in sorted(out.iterdir())))
          PYCODE
          python /tmp/bt153-build.py
      - name: Upload assets to draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          url=$(gh api repos/baboltoyoorbazargani-pixel/baboltoyoor/releases/431237926 --jq '.upload_url' | sed 's/{.*//')
          for file in /tmp/bt153-assets/*; do
            name=$(basename "$file")
            curl --fail --silent --show-error -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Content-Type: application/octet-stream' --data-binary "@$file" "$url?name=$name" > /dev/null
            echo "Uploaded $name"
          done
