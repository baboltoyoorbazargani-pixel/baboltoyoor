name: Temporary 1.0.64 verification and package
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: tooling
      - uses: actions/checkout@v4
        with:
          ref: 707d40d98b57d16972edb1672f3a989831b0db9b
          path: source
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser verification
        working-directory: source
        run: |
          npm install --no-save --no-package-lock playwright-core
          export BT_CHROMIUM_PATH=$(which google-chrome || which chromium || which chromium-browser)
          set +e
          node --test tests/appearance-editor-browser.test.js tests/print-no-popup-browser.test.js tests/remote-enter-browser.test.js tests/deposits-browser.test.js tests/warehouse-store-document-browser.test.js > /tmp/results.txt 2>&1
          result=$?
          cat /tmp/results.txt
          if [ "$result" -ne 0 ]; then echo "::error title=BrowserTestLog::$(base64 -w0 /tmp/results.txt)"; fi
          exit "$result"
      - name: Verify and build
        working-directory: source
        run: |
          test "$(git rev-parse HEAD)" = 707d40d98b57d16972edb1672f3a989831b0db9b
          sha256sum -c SHA256SUMS.txt
          python ../tooling/.github/scripts/arena-build-release.py
      - name: Upload to draft
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v1.0.64 /tmp/babol-release-64/* --clobber
