name: Temporary verified 1.0.79 packaging
on: [push, workflow_dispatch]
jobs:
  verify-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Checkout packaging tools
        uses: actions/checkout@v4
        with:
          path: tooling
      - name: Checkout exact release source
        uses: actions/checkout@v4
        with:
          ref: 734eb22ad3f0ffae82096456e03f902b5ae5fbb6
          path: source
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source and test in Chromium
        working-directory: source
        run: |
          sha256sum -c SHA256SUMS.txt >/dev/null
          npm install --no-save --no-package-lock playwright-core
          export BT_CHROMIUM_PATH=$(which google-chrome || which chromium || which chromium-browser)
          node --test --test-concurrency=2 tests/transport-desk-browser.test.js tests/transport-plans-api.test.js tests/transport-resources-browser.test.js tests/transport-fleet-assignment-api.test.js tests/transport-financial-layout-browser.test.js tests/store-run-reopen.test.js tests/store-run-restart-policy.test.js tests/store-run-reopen-browser.test.js tests/store-run-auto-finalize.test.js tests/store-run-send-append.test.js tests/store-runs.test.js tests/store-partial-api.test.js tests/store-partial-browser.test.js tests/warehouse-store-document-browser.test.js tests/warehouse-store-history-tab.test.js tests/warehouse-store-details-prep-sheet.test.js tests/transport-handover-browser.test.js tests/store-form-and-warehouse-completion.test.js tests/release-version.test.js tests/windows-installer.test.js
      - name: Build release assets
        working-directory: source
        run: python ../tooling/scripts/arena-release-build.py "$RUNNER_TEMP/assets"
      - name: Upload assets to draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v1.0.79 "$RUNNER_TEMP"/assets/* --repo "$GITHUB_REPOSITORY" --clobber
