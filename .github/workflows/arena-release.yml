name: Temporary verified 1.0.72 packaging
on: [push, workflow_dispatch]
jobs:
  verify-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Checkout packaging tools
        uses: actions/checkout@v4
        with:
          path: tooling
      - name: Checkout exact release source
        uses: actions/checkout@v4
        with:
          ref: 003e2b9b6e5d42c8ef522aff9545f3abea7b4a8b
          path: source
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source and test in Chromium
        working-directory: source
        run: |
          sha256sum -c SHA256SUMS.txt >/dev/null
          npm install --no-save --no-package-lock playwright-core
          export BT_CHROMIUM_PATH=$(which google-chrome || which chromium || which chromium-browser)
          set +e
          node --test --test-concurrency=2 tests/pickup-*.test.js tests/warehouse-weighing-browser.test.js tests/warehouse-weight-draft-api.test.js tests/gate-search-onsite-layout-browser.test.js tests/transport-resources-browser.test.js tests/transport-fleet-assignment-api.test.js tests/sales-layout-daily-browser.test.js tests/transport-plans-api.test.js tests/release-version.test.js tests/windows-installer.test.js > /tmp/results.txt 2>&1
          result=$?
          cat /tmp/results.txt
          if [ "$result" -ne 0 ]; then echo "::error title=BrowserTestLog::$(base64 -w0 /tmp/results.txt)"; fi
          exit "$result"
      - name: Build release assets
        working-directory: source
        run: python ../tooling/scripts/arena-release-build.py "$RUNNER_TEMP/assets"
      - name: Upload assets to draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v1.0.72 "$RUNNER_TEMP"/assets/* --repo "$GITHUB_REPOSITORY" --clobber
