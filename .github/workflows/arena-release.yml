name: Temporary 1.0.61 verification and package
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: tooling
      - uses: actions/checkout@v4
        with:
          ref: 11d593f2786b9aff2b5d61e6df1f1dc90bd9a79a
          path: source
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser verification
        working-directory: source
        run: |
          npm install --no-save --no-package-lock playwright-core
          export BT_CHROMIUM_PATH=$(which google-chrome || which chromium || which chromium-browser)
          node --test tests/notification-precision-browser.test.js tests/notification-browser.test.js tests/notification-roles-compact-browser.test.js tests/sales-delivery-tabs-browser.test.js
      - name: Verify and build
        working-directory: source
        run: |
          test "$(git rev-parse HEAD)" = 11d593f2786b9aff2b5d61e6df1f1dc90bd9a79a
          sha256sum -c SHA256SUMS.txt
          python ../tooling/.github/scripts/arena-build-release.py
      - name: Upload to draft
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v1.0.61 /tmp/babol-release/* --clobber
