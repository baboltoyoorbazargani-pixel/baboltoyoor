name: Build release 1.0.49
on: [push]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a2b80ac869615c647046d89cf12c6a465fc0f698
      - name: Build and verify packages
        run: |
          export OUT="$RUNNER_TEMP/bt-release"
          python3 - <<'PYCODE'
          import os,subprocess,zipfile,hashlib
          from pathlib import Path
          v='1.0.49'; out=Path(os.environ.get('OUT','/tmp/bt149-package'));out.mkdir(parents=True,exist_ok=True)
          def add(z,name,data):
           i=zipfile.ZipInfo(name,(2026,1,1,0,0,0));i.compress_type=zipfile.ZIP_DEFLATED;i.external_attr=0o100644<<16;z.writestr(i,data,compress_type=zipfile.ZIP_DEFLATED,compresslevel=9)
          files=sorted(p for p in subprocess.check_output(['git','ls-files','-z']).decode().split('\0') if p and not p.startswith('.github/'))
          with zipfile.ZipFile(out/f'BabolToyor-App-{v}.zip','w') as z:
           for p in files:add(z,p,Path(p).read_bytes())
          setup=Path('windows-installer/BabolToyor-Setup.cmd').read_bytes();(out/f'BabolToyor-Setup-{v}.cmd').write_bytes(setup)
          with zipfile.ZipFile(out/f'BabolToyor-Windows-Setup-{v}.zip','w') as z:
           add(z,'app.zip',(out/f'BabolToyor-App-{v}.zip').read_bytes());add(z,'BabolToyor-Setup.cmd',setup)
           for p in ['INSTALL-STEPS-fa.md','INSTALL-STEPS-fa.html','README-fa.md']:add(z,p,Path('windows-installer',p).read_bytes())
          for p in ['domain-https-fa.md','reports-backup-update-fa.md']:(out/p).write_bytes(Path('docs',p).read_bytes())
          assets=[f'BabolToyor-App-{v}.zip',f'BabolToyor-Setup-{v}.cmd',f'BabolToyor-Windows-Setup-{v}.zip','domain-https-fa.md','reports-backup-update-fa.md']
          (out/f'SHA256SUMS-{v}.txt').write_text(''.join(f'{hashlib.sha256((out/p).read_bytes()).hexdigest()}  {p}\n' for p in assets))
          for p in assets+[f'SHA256SUMS-{v}.txt']:print(p,(out/p).stat().st_size,hashlib.sha256((out/p).read_bytes()).hexdigest())
          PYCODE
          cd "$OUT"
          sha256sum -c SHA256SUMS-1.0.49.txt
          unzip -t BabolToyor-App-1.0.49.zip >/dev/null
          unzip -t BabolToyor-Windows-Setup-1.0.49.zip >/dev/null
      - name: Upload to draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for file in "$RUNNER_TEMP"/bt-release/*; do
            gh api --method POST -H 'Content-Type: application/octet-stream' --input "$file" "https://uploads.github.com/repos/baboltoyoorbazargani-pixel/baboltoyoor/releases/431117002/assets?name=$(basename "$file")" >/dev/null
          done
