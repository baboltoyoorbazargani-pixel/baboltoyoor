name: Temporary verified 1.0.84 packaging
on: [push, workflow_dispatch]
jobs:
  verify-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Checkout packaging tools
        uses: actions/checkout@v4
        with:
          path: tooling
      - name: Checkout exact release source
        uses: actions/checkout@v4
        with:
          ref: 761cfa40b95491f0e3e74ef31c04f14382ca08e4
          path: source
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source and tests in Chromium
        working-directory: source
        run: |
          sha256sum -c SHA256SUMS.txt >/dev/null
          npm install --no-save --no-package-lock playwright-core
          export BT_CHROMIUM_PATH=$(which google-chrome || which chromium || which chromium-browser)
          node --test --test-concurrency=2 tests/warehouse-store-document-browser.test.js tests/warehouse-store-tabs.test.js tests/warehouse-store-history-tab.test.js tests/warehouse-weighing-browser.test.js tests/warehouse-delivered-browser.test.js tests/warehouse-document-layout.test.js tests/release-version.test.js tests/windows-installer.test.js
      - name: Build release assets
        working-directory: source
        run: python ../tooling/scripts/arena-release-build.py "$RUNNER_TEMP/assets"
      - name: Upload assets to draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v1.0.84 "$RUNNER_TEMP"/assets/* --repo "$GITHUB_REPOSITORY" --clobber
