name: Temporary 1.0.63 browser verification and package
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: tooling
      - uses: actions/checkout@v4
        with:
          ref: d2805b4494fb45c2681afe68e09c3137bca2db20
          path: source
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser verification
        working-directory: source
        run: |
          npm install --no-save --no-package-lock playwright-core
          export BT_CHROMIUM_PATH=$(which google-chrome || which chromium || which chromium-browser)
          node --test tests/appearance-editor-browser.test.js tests/transport-desk-browser.test.js tests/warehouse-document-layout.test.js
      - name: Verify and build
        working-directory: source
        run: |
          test "$(git rev-parse HEAD)" = d2805b4494fb45c2681afe68e09c3137bca2db20
          sha256sum -c SHA256SUMS.txt
          python ../tooling/.github/scripts/arena-build-release.py
      - name: Upload to draft
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v1.0.63 /tmp/babol-release/* --clobber
