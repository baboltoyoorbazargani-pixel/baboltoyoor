name: Temporary build and upload release 1.0.58
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8036b25d19c50a1705d64f21aeb8cedf859ac1d3
      - name: Build and upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/build.py <<'PYCODE'
          import hashlib, subprocess, zipfile, shutil
          from pathlib import Path
          v='1.0.58'
          out=Path('/tmp/bt158-assets'); out.mkdir(exist_ok=True)
          files=sorted(x for x in subprocess.check_output(['git','ls-files','-z']).decode().split('\0') if x and not x.startswith('.github/'))
          def write_zip(path, entries):
              with zipfile.ZipFile(path,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
                  for name, data in entries:
                      info=zipfile.ZipInfo(name,(2020,1,1,0,0,0)); info.compress_type=zipfile.ZIP_DEFLATED; info.external_attr=0o100644 << 16
                      z.writestr(info,data,compress_type=zipfile.ZIP_DEFLATED,compresslevel=9)
          app=out/f'BabolToyor-App-{v}.zip'
          write_zip(app,[(p,Path(p).read_bytes()) for p in files])
          setup=out/f'BabolToyor-Setup-{v}.cmd';shutil.copyfile('windows-installer/BabolToyor-Setup.cmd',setup)
          write_zip(out/f'BabolToyor-Windows-Setup-{v}.zip', [('app.zip',app.read_bytes()),('BabolToyor-Setup.cmd',setup.read_bytes())]+[(Path(p).name,Path(p).read_bytes()) for p in ['windows-installer/INSTALL-STEPS-fa.html','windows-installer/INSTALL-STEPS-fa.md','windows-installer/README-fa.md']])
          for p in ['docs/domain-https-fa.md','docs/reports-backup-update-fa.md']:shutil.copyfile(p,out/Path(p).name)
          assets=sorted(out.iterdir());(out/f'SHA256SUMS-{v}.txt').write_text(''.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n' for p in assets))
          PYCODE
          python /tmp/build.py
          sha256sum /tmp/bt158-assets/*
          gh release upload v1.0.58 /tmp/bt158-assets/* --clobber
