name: Publish reports and backup update
on:
  push:
    branches: [arena/57a284bb-baboltoyoor]
    paths: [.github/workflows/arena-publish-update.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 34b298c33596a8db96f55867e60deb808de96653
      - name: Verify source and build offline installer bundle
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c SHA256SUMS.txt
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          import hashlib, shutil
          root = Path.cwd()
          out = Path('/tmp/bt-release')
          out.mkdir(exist_ok=True)
          app = out / 'app.zip'
          with ZipFile(app, 'w', ZIP_DEFLATED, compresslevel=9) as z:
              for p in sorted(root.rglob('*')):
                  if not p.is_file() or p.is_symlink(): continue
                  rel = p.relative_to(root)
                  if any(x in ('.git', 'node_modules', 'data', 'data-preview', 'build', 'dist') for x in rel.parts): continue
                  if rel.name == '.env' or rel.name.endswith(('.db', '.db-wal', '.db-shm', '.log')): continue
                  z.write(p, rel.as_posix())
          bundle = out / 'BabolToyor-Windows-Setup.zip'
          with ZipFile(bundle, 'w', ZIP_DEFLATED, compresslevel=9) as z:
              z.write(app, 'app.zip')
              z.write(root / 'windows-installer/BabolToyor-Setup.cmd', 'BabolToyor-Setup.cmd')
              z.write(root / 'docs/reports-backup-update-fa.md', 'REPORTS-BACKUP-UPDATE-fa.md')
          with ZipFile(bundle) as z: assert z.testzip() is None
          with ZipFile(app) as z:
              assert z.testzip() is None
              assert all(n in z.namelist() for n in ('server.js', 'lib/routes/backups.js', 'lib/routes/unit-reports.js', 'lib/unit-reports.js'))
          shutil.copyfile(bundle, out / 'BabolToyor-Update-Reports-Backup.zip')
          digest = hashlib.sha256(bundle.read_bytes()).hexdigest()
          (out / 'BabolToyor-Windows-Setup.zip.sha256').write_text(digest + '  BabolToyor-Windows-Setup.zip\n')
          print('SHA256:', digest, 'size:', bundle.stat().st_size)
          PY
      - name: Publish assets to the existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v37.43.0 /tmp/bt-release/BabolToyor-Windows-Setup.zip /tmp/bt-release/BabolToyor-Update-Reports-Backup.zip /tmp/bt-release/BabolToyor-Windows-Setup.zip.sha256 docs/reports-backup-update-fa.md --clobber
