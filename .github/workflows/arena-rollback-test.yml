name: Temporary rollback browser checks
on: [push, workflow_dispatch]
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright-core
      - name: Browser checks
        run: |
          export BT_CHROMIUM_PATH=$(which google-chrome || which chromium || which chromium-browser)
          set +e
          node --test tests/print-no-popup-browser.test.js tests/remote-enter-browser.test.js tests/deposits-browser.test.js tests/warehouse-store-document-browser.test.js > /tmp/results.txt 2>&1
          result=$?
          cat /tmp/results.txt
          if [ "$result" -ne 0 ]; then echo "::error title=BrowserTestLog::$(base64 -w0 /tmp/results.txt)"; fi
          exit "$result"
