name: Attach BabolToyor 1.0.86 release assets

on:
  push:
    branches:
      - arena/601bfa76-baboltoyoor
    paths:
      - .github/workflows/attach-v1-0-86-release-assets.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  attach-release-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Download the verified Google Drive release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          download() {
            local name="$1" id="$2" target tmp mime url
            target="release-assets/${name}"
            tmp="${target}.part"
            for url in \
              "https://drive.usercontent.google.com/download?id=${id}&export=download&authuser=0&confirm=t" \
              "https://drive.google.com/uc?id=${id}&export=download"; do
              if curl --fail --silent --show-error --location \
                --connect-timeout 15 --max-time 120 \
                --retry 2 --retry-all-errors --retry-delay 2 \
                --user-agent 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/130 Safari/537.36' \
                "$url" --output "$tmp"; then
                mime="$(file --brief --mime-type "$tmp")"
                if [[ "$mime" != text/html ]]; then
                  mv "$tmp" "$target"
                  echo "Downloaded ${name}: ${mime}, $(wc -c < "$target") bytes"
                  return 0
                fi
                echo "::warning title=Google Drive returned HTML::${name} was not served as a file by ${url}"
              fi
              rm -f "$tmp"
            done
            echo "::error title=Google Drive download failed::${name} could not be fetched as a file from either Drive download URL"
            return 1
          }
          download BabolToyor-App-1.0.86.zip 176rvP8igqwtYWn0lIGzljwLzt5NEBQGF
          download BabolToyor-Windows-Setup-1.0.86.zip 1Dx271xGkvvztMVdCNQw1_nAWCs89gt2X
          download BabolToyor-Setup-1.0.86.cmd 1ojRa8Cev8BUoiqJJSLhavjhc1aJHRari
          download RELEASE-1.0.86-fa.md 1lMWlvuBRWaRu051acwvTv3vFXQnw1W3W
          download domain-https-fa.md 1X16psMBYCg4rj1LbEXn9XXDZzvQ2Eb4y
          download reports-backup-update-fa.md 13gMqZtmADIWgESCXRS85o1eqzrjHboqy
          download SHA256SUMS-1.0.86.txt 1uKEFAXJbinvtDjuJ2XjNYBHKes-dyi55

      - name: Verify the downloaded package and checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          {
            echo '## v1.0.86 asset verification diagnostics'
            echo
            echo '### Downloaded file sizes and types'
            ls -lh
            file BabolToyor-App-1.0.86.zip BabolToyor-Windows-Setup-1.0.86.zip BabolToyor-Setup-1.0.86.cmd RELEASE-1.0.86-fa.md domain-https-fa.md reports-backup-update-fa.md SHA256SUMS-1.0.86.txt
            echo
            echo '### SHA-256 values actually downloaded'
            sha256sum BabolToyor-App-1.0.86.zip BabolToyor-Windows-Setup-1.0.86.zip BabolToyor-Setup-1.0.86.cmd RELEASE-1.0.86-fa.md domain-https-fa.md reports-backup-update-fa.md
            echo
            echo '### Expected SHA-256 manifest'
            cat SHA256SUMS-1.0.86.txt
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          if sha256sum --check SHA256SUMS-1.0.86.txt > /tmp/sha256-check.txt 2>&1; then
            cat /tmp/sha256-check.txt >> "$GITHUB_STEP_SUMMARY"
          else
            result=$?
            {
              echo '### Checksum verification failed'
              cat /tmp/sha256-check.txt
            } >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/sha256-check.txt
            diagnostic="$(tr '\n' ';' < /tmp/sha256-check.txt | cut -c1-400)"
            echo "::error title=Checksum verification failed::${diagnostic}"
            exit "$result"
          fi

          for archive in BabolToyor-App-1.0.86.zip BabolToyor-Windows-Setup-1.0.86.zip; do
            if unzip -t "$archive" > /tmp/unzip-check.txt 2>&1; then
              echo "ZIP integrity OK: $archive" >> "$GITHUB_STEP_SUMMARY"
            else
              result=$?
              {
                echo "### ZIP integrity failed: $archive"
                cat /tmp/unzip-check.txt
              } >> "$GITHUB_STEP_SUMMARY"
              cat /tmp/unzip-check.txt
              diagnostic="$(tr '\n' ';' < /tmp/unzip-check.txt | cut -c1-400)"
              echo "::error title=ZIP integrity failed::${archive}: ${diagnostic}"
              exit "$result"
            fi
          done
          echo 'All seven v1.0.86 assets downloaded and verified.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload assets to the v1.0.86 draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload v1.0.86 \
            release-assets/BabolToyor-App-1.0.86.zip \
            release-assets/BabolToyor-Windows-Setup-1.0.86.zip \
            release-assets/BabolToyor-Setup-1.0.86.cmd \
            release-assets/RELEASE-1.0.86-fa.md \
            release-assets/domain-https-fa.md \
            release-assets/reports-backup-update-fa.md \
            release-assets/SHA256SUMS-1.0.86.txt \
            --clobber --repo "$GITHUB_REPOSITORY"
          gh release view v1.0.86 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'