name: Temporary browser regression
on:
  push:
    branches: [arena/a5290389-baboltoyoor]
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock playwright-core
      - name: Browser workflow and layout tests
        shell: bash
        run: |
          set +e
          export BT_CHROMIUM_PATH="$(command -v google-chrome || command -v chromium-browser || command -v chromium)"
          node --test --test-concurrency=1 tests/transport-financial-layout-browser.test.js tests/order-unified-layout-browser.test.js tests/transport-handover-browser.test.js tests/settlement-open-browser.test.js > /tmp/browser.log 2>&1
          rc=$?
          cat /tmp/browser.log
          if [ "$rc" -ne 0 ]; then
            python - <<'PY'
          import base64
          text=open('/tmp/browser.log','rb').read()
          print('::error title=Browser test log (base64)::'+base64.b64encode(text[-25000:]).decode())
          PY
          fi
          exit "$rc"
